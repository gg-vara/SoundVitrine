name: SoundVitrine

services:
  app:
    restart: on-failure:1
    image: Amphaal/soundvitrine
    build:
      context: ../app
    command: ["bun", "--watch", "server/index.ts"]
    ports:
      - "80:80" # HTTP
    volumes:
     - ../_state:/app/_state:rw
    environment:
      NODE_ENV: "development"
      ALLOW_SSE_TESTING: "1" # dev-only
      ENFORCE_CANONICAL_HTTP_SCHEME: "1"
    develop:
      watch:
        - action: sync
          path: ../app/server
          target: /app/server
        - action: sync
          path: ../app/client/legacy
          target: /app/client/legacy
        - action: sync
          path: ../app/client/public
          target: /app/client/public
