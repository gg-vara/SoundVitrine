name: SoundVitrine

services:
  app:
    restart: on-failure:1
    image: Amphaal/soundvitrine
    build:
      context: ../app
    command: ["bun", "--watch", "src/index.ts"]
    ports:
      - "80:80" # HTTP
    volumes:
     - ../_state:/app/_state:rw
    environment:
      NODE_ENV: "development"
      ALLOW_SSE_TESTING: "1" # dev-only
      ENFORCE_CANONICAL_HTTP_SCHEME: "1"
    develop:
      watch:
        - action: sync
          path: ../app/src
          target: /app/src
        - action: sync
          path: ../app/assets
          target: /app/assets
        - action: sync
          path: ../app/public
          target: /app/public
